name: Import Dbweb Android source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-dbweb-android-source.yml"
      - "source/Dbweb-Android-Source-Download.zip"

permissions:
  contents: write

concurrency:
  group: dbweb-android-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        run: |
          unzip -tq source/Dbweb-Android-Source-Download.zip
          rm -rf android
          mkdir -p android
          unzip -q source/Dbweb-Android-Source-Download.zip 'cloudsrc/*' -d extracted
          cp -a extracted/cloudsrc/. android/
          rm -rf android/cloudstream-master
          test -f android/gradlew
          test -f android/app/build.gradle.kts

      - name: Apply Dbweb app integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android')
          layout = root / 'app/src/main/res/layout/main_settings.xml'
          xml = layout.read_text()
          marker = '            <LinearLayout\n                android:id="@+id/app_version_info"'
          if 'android:id="@+id/dbweb_website"' not in xml:
              insert = '''            <TextView
                  android:id="@+id/dbweb_website"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:padding="10dp"
                  android:text="Dbweb Website"
                  android:textColor="?attr/colorAccent"
                  android:clickable="true"
                  android:focusable="true" />

          '''
              if marker not in xml: raise SystemExit('Settings footer insertion point not found')
              layout.write_text(xml.replace(marker, insert + marker, 1))
          kt = root / 'app/src/main/java/com/lagradost/cloudstream3/ui/settings/SettingsFragment.kt'
          code = kt.read_text()
          anchor = '        binding.appVersion.text = appVersion'
          if 'binding.dbwebWebsite.setOnClickListener' not in code:
              wiring = '''        binding.dbwebWebsite.setOnClickListener {
                      runCatching { startActivity(android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse("https://webdd.freeddns.org"))) }
                  }
          '''
              if anchor not in code: raise SystemExit('Settings binding insertion point not found')
              kt.write_text(code.replace(anchor, wiring + anchor, 1))
          kt = root / 'app/src/main/java/com/lagradost/cloudstream3/ui/settings/extensions/ExtensionsFragment.kt'
          code = kt.read_text().replace('addRepoButton.isGone = isTv\n            addRepoButtonImageviewHolder.isVisible = isTv', 'addRepoButton.isGone = true\n            addRepoButtonImageviewHolder.isGone = true')
          kt.write_text(code)
          status = root / 'DBWEB_IMPLEMENTATION_STATUS.md'
          status.write_text('''# Dbweb Android implementation status

This is a Dbweb-branded Android fork built on the CloudStream-compatible runtime.

## Implemented
- Android application ID: `com.chatpataprani.dbweb`.
- App label and Android share/play-with label: Dbweb.
- Dbweb launcher artwork is wired into adaptive launcher icons.
- Extensions screen contains a Dbweb website card.
- Main Settings screen contains a Dbweb website link.
- Manual repository-add buttons are hidden from the standard extensions UI.
- Existing extension runtime and installed-extension management are retained.
- Upstream GPL-3.0 licence and required notices are retained.

## Limitations
- `https://webdd.freeddns.org` currently opens as a website. No public extension catalogue API/manifest has been supplied, so in-app catalogue browsing, installation, and updates are not implemented.
- CloudStream-compatible internal package names, protocol identifiers, and upstream notices remain where required for compatibility and licensing.
- APK build and runtime/device tests must pass in GitHub Actions before this is a verified release.
''')
          PY

      - name: Commit extracted source to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "Android source is already up to date."
            exit 0
          fi
          git commit -m "Import extracted Dbweb Android source"
          git push
