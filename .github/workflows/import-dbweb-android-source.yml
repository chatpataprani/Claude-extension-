name: Import Dbweb Android source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-dbweb-android-source.yml"
      - "source/Dbweb-Android-Source-Download.zip"

permissions:
  contents: write

concurrency:
  group: dbweb-android-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project
        run: |
          unzip -tq source/Dbweb-Android-Source-Download.zip
          rm -rf android
          mkdir -p android
          unzip -q source/Dbweb-Android-Source-Download.zip 'cloudsrc/*' -d extracted
          cp -a extracted/cloudsrc/. android/
          rm -rf android/cloudstream-master
          test -f android/gradlew
          test -f android/app/build.gradle.kts

      - name: Apply Dbweb app integration
        run: python3 .github/scripts/patch_dbweb_android.py

      - name: Commit extracted source to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "Android source is already up to date."
            exit 0
          fi
          git commit -m "Import extracted Dbweb Android source"
          git push
