name: Build Dbweb Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/Dbweb-Android-Source-Download.zip"
      - ".github/workflows/dbweb-android.yml"

permissions:
  contents: read

concurrency:
  group: dbweb-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Dbweb stable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          ARCHIVE="source/Dbweb-Android-Source-Download.zip"
          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Extract Android source
        run: |
          mkdir -p build-source
          unzip -q source/Dbweb-Android-Source-Download.zip -d build-source
          test -f build-source/cloudsrc/gradlew
          test -f build-source/cloudsrc/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install stable Android SDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Initialize Git metadata for extracted source
        working-directory: build-source/cloudsrc
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git -c commit.gpgsign=false commit -m "Dbweb Android source build"

      - name: Set compile SDK to installed stable platform
        working-directory: build-source/cloudsrc
        run: |
          grep '^compileSdk' gradle/libs.versions.toml
          grep -q '^compileSdk = "37"

      - name: Provide Git metadata for version generation
        working-directory: build-source/cloudsrc
        run: |
          mkdir -p .git/refs/heads
          printf 'ref: refs/heads/main\\n' > .git/HEAD
          printf '%s\\n' "$GITHUB_SHA" > .git/refs/heads/main

      - name: Build stable debug APK
        working-directory: build-source/cloudsrc
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug

      - name: Verify APK and calculate checksum
        run: |
          APK="build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dbweb-Android-stable-debug
          path: build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk
          if-no-files-found: error
          retention-days: 30
 gradle/libs.versions.toml
          test -d "$ANDROID_HOME/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Provide Git metadata for version generation
        working-directory: build-source/cloudsrc
        run: |
          mkdir -p .git/refs/heads
          printf 'ref: refs/heads/main\\n' > .git/HEAD
          printf '%s\\n' "$GITHUB_SHA" > .git/refs/heads/main

      - name: Build stable debug APK
        working-directory: build-source/cloudsrc
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug

      - name: Verify APK and calculate checksum
        run: |
          APK="build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dbweb-Android-stable-debug
          path: build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk
          if-no-files-found: error
          retention-days: 30
