name: Build Dbweb Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/dbweb-android.yml"

permissions:
  contents: read

concurrency:
  group: dbweb-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Dbweb stable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify extracted Android source
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle.kts

      - name: Audit Dbweb branding and extension management
        working-directory: android
        run: |
          echo "=== WEBSITE REFERENCES ==="
          grep -RIn --include='*.kt' --include='*.xml' --include='*.java' --include='*.html' 'webdd\\.freeddns\\.org' app/src/main || true
          echo "=== DBWEB BRAND REFERENCES ==="
          grep -RIn --include='*.kt' --include='*.xml' 'Dbweb' app/src/main | head -100 || true
          echo "=== LAUNCHER RESOURCE WIRING ==="
          grep -nE 'android:icon|android:roundIcon|application' app/src/main/AndroidManifest.xml
          find app/src/main/res -maxdepth 2 -type f | grep -E 'mipmap|launcher|splash|logo' | sort | head -100
          echo "=== MANUAL REPOSITORY AND PLUGIN CONTROLS ==="
          grep -RIn --include='*.kt' -E 'addRepository|addPlugin|Add repository|Add Repository|Add plugin|Add Plugin|repositoryUrl|pluginUrl' app/src/main/java/com/lagradost/cloudstream3/ui/settings/extensions app/src/main/java/com/lagradost/cloudstream3/plugins | head -160 || true
          echo "=== ABOUT / SETTINGS SCREENS ==="
          grep -RIn --include='*.kt' -E 'About|Settings|website|WebSite|browser' app/src/main/java/com/lagradost/cloudstream3/ui/settings | head -120 || true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install Android API 37 and build tools
        run: |
          sdkmanager --channel=3 --list | grep -E 'platforms;android-37|build-tools;37'
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"

      - name: Build stable debug APK
        working-directory: build-source/cloudsrc
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug

      - name: Verify APK and calculate checksum
        run: |
          APK="app/build/outputs/apk/stable/debug/app-stable-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dbweb-Android-stable-debug
          path: android/app/build/outputs/apk/stable/debug/app-stable-debug.apk
          if-no-files-found: error
          retention-days: 30
