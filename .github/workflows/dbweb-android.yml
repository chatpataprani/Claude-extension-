name: Build Dbweb Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "source/Dbweb-Android-source.zip"
      - ".github/workflows/dbweb-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          test -f source/Dbweb-Android-source.zip || {
            echo "::error::Upload source/Dbweb-Android-source.zip before running this workflow."
            exit 1
          }

      - name: Extract Android source
        run: |
          mkdir -p build-source
          unzip -q source/Dbweb-Android-source.zip -d build-source
          test -f build-source/cloudsrc/gradlew
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/build-source/cloudsrc" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: build-source/cloudsrc
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dbweb-debug-apk
          path: build-source/cloudsrc/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
