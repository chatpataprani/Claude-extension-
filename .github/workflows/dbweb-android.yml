name: Build Dbweb Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source/Dbweb-Android-Source-Download.zip"
      - ".github/workflows/dbweb-android.yml"

permissions:
  contents: read

concurrency:
  group: dbweb-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Dbweb stable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          ARCHIVE="source/Dbweb-Android-Source-Download.zip"
          test -s "$ARCHIVE"
          unzip -tq "$ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Extract Android source
        run: |
          mkdir -p build-source
          unzip -q source/Dbweb-Android-Source-Download.zip -d build-source
          test -f build-source/cloudsrc/gradlew
          test -f build-source/cloudsrc/app/build.gradle.kts

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Build stable debug APK
        working-directory: build-source/cloudsrc
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug

      - name: Verify APK and calculate checksum
        run: |
          APK="build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dbweb-Android-stable-debug
          path: build-source/cloudsrc/app/build/outputs/apk/stable/debug/app-stable-debug.apk
          if-no-files-found: error
          retention-days: 30
